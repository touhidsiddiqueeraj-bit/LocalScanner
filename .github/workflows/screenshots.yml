name: Screenshots

# Renders the real Compose UI on a JVM runner (Robolectric + Roborazzi) and
# commits the PNGs to docs/screenshots/ so the README always shows the app.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/src/test/java/com/localscanner/app/**'
      - 'app/src/main/java/com/localscanner/app/ui/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  render:
    name: Render UI screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Run screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "com.localscanner.app.AppScreenshots" --stacktrace

      - name: Collect and commit screenshots
        run: |
          echo "workspace: $(pwd)"
          find . -type f -name "*.png" -path "*screenshot*" -print
          mkdir -p docs/screenshots
          find . -type f -name "*.png" -path "*screenshot*" ! -path "./docs/*" -exec cp {} docs/screenshots/ \;
          ls -la docs/screenshots
          count=$(ls docs/screenshots/*.png 2>/dev/null | wc -l)
          echo "captured $count screenshots"
          if [ "$count" -lt 8 ]; then
            echo "::error::Expected the screenshot suite to render at least 8 PNGs, found $count"
            exit 1
          fi
          git status --porcelain | head -20
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git check-ignore -v docs/screenshots/*.png || echo "(not ignored)"
          git add -fv docs/screenshots 2>&1 | head -20
          echo "staged:"
          git diff --cached --stat | head -15
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "docs: refresh UI screenshots [skip ci]"
            git push
          else
            echo "::warning::No screenshot changes were staged"
          fi

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: docs/screenshots/*.png
          retention-days: 30
